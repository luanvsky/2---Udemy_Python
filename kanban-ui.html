<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanban Jira</title>
<style>
  /* ============================================================
     Tema escuro silencioso: cor só onde significa algo
     (prioridade e categoria de status).
     ============================================================ */
  :root{
    --bg:#0e1013;
    --bg-2:#131619;
    --sup:#171b1f;
    --sup-2:#1c2126;
    --line:#242a30;
    --line-2:#1b2025;
    --txt:#e7eaee;
    --txt-2:#a8b1bb;
    --dim:#78828d;
    --accent:#5b9cf8;
    --accent-bg:#5b9cf81a;
    --ok:#4fbf7f;
    --err:#f0716c;
    --warn:#e0a45e;
    --radius:10px;
    --raio-s:7px;
    --sombra:0 1px 2px #00000040, 0 8px 24px #00000030;
    --sombra-forte:0 12px 40px #00000060;
    --t:150ms ease;
    --col-w:288px;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* rolagem discreta */
  *{scrollbar-width:thin;scrollbar-color:#2b3238 transparent}
  *::-webkit-scrollbar{width:9px;height:9px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:#2b3238;border-radius:20px;border:2px solid transparent;background-clip:content-box}
  *::-webkit-scrollbar-thumb:hover{background:#3a4249;background-clip:content-box}

  /* ---------------------------- controles base ---------------------------- */
  input,select,button,textarea{
    font-family:inherit;font-size:13px;color:var(--txt);
    background:var(--sup-2);border:1px solid var(--line);
    border-radius:var(--raio-s);padding:7px 10px;
    transition:border-color var(--t),background var(--t),color var(--t);
  }
  input::placeholder,textarea::placeholder{color:#616b76}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#3d4c5e;background:#1f242a}
  input[type=date]{color-scheme:dark}
  select{cursor:pointer;appearance:none;padding-right:26px;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  button{cursor:pointer}
  button:hover:not(:disabled){background:#242a31;border-color:#333b43}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:default}
  button.prim{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.prim:hover:not(:disabled){background:#6fa9fa;border-color:#6fa9fa}
  button.perigo{color:var(--err);border-color:#4a2b2b}
  button.perigo:hover:not(:disabled){background:#2a1c1e;border-color:#6b3838}
  button.mini{padding:4px 9px;font-size:12px;border-radius:6px}
  button.limpo{background:none;border-color:transparent;color:var(--txt-2);padding:4px 6px;font-size:12px}
  button.limpo:hover:not(:disabled){background:var(--sup-2);border-color:transparent;color:var(--txt)}
  .oculto{display:none !important}

  /* ------------------------------- cabeçalho ------------------------------ */
  header{
    flex:0 0 auto;padding:12px 20px 0;background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .topo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:11px}
  .marca{display:flex;align-items:baseline;gap:9px;min-width:0}
  .marca h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
  .marca .tag-proj{
    font-size:11.5px;color:var(--dim);border:1px solid var(--line);
    border-radius:20px;padding:1px 9px;background:var(--sup);white-space:nowrap
  }
  .contador{font-size:12.5px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
  .contador b{color:var(--txt-2);font-weight:600}
  /* Acesso fixo ao app de conformidade. Fica sempre visivel porque o numero de
     processo nem sempre esta no resumo da issue, entao o botao por-issue nao
     basta para o quadro ficar "ligado" ao aplicativo. */
  .link-app{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
    border:1px solid var(--line);border-radius:var(--raio-s);background:transparent;
    color:var(--txt-2);font-size:13px;text-decoration:none;white-space:nowrap;
    transition:background var(--t),border-color var(--t),color var(--t)}
  .link-app:hover{background:var(--sup-2);border-color:var(--line-2);color:var(--txt)}
  .esp{flex:1 1 auto;min-width:0}
  #busca{width:230px;max-width:38vw}
  .seg{display:flex;border:1px solid var(--line);border-radius:var(--raio-s);overflow:hidden;background:var(--sup-2)}
  .seg button{border:0;border-radius:0;background:transparent;padding:7px 13px;color:var(--txt-2)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button:hover:not(:disabled){background:#21272e}
  .seg button.on{background:var(--sup-2);color:var(--txt);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}

  /* filtros */
  .filtros{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 0 12px;border-top:1px solid var(--line-2);padding-top:11px}
  .filtros .rot{color:var(--dim);font-size:12px;white-space:nowrap}
  .filtros select,.filtros input{font-size:12.5px;padding:5px 9px}
  .filtros select{padding-right:24px}
  .inter{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--txt-2);
    background:var(--sup-2);border:1px solid var(--line);border-radius:20px;
    padding:5px 12px;cursor:pointer;user-select:none;transition:all var(--t)
  }
  .inter:hover{border-color:#333b43;color:var(--txt)}
  .inter .pt{width:7px;height:7px;border-radius:50%;background:#3a4249;transition:background var(--t)}
  .inter.on{background:var(--accent-bg);border-color:#2f4d75;color:var(--txt)}
  .inter.on .pt{background:var(--accent)}

  /* -------------------------------- quadro -------------------------------- */
  #palco{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
  #vista{flex:1;min-height:0;overflow:auto;padding:16px 20px 32px}
  .aviso-vazio{color:var(--dim);text-align:center;padding:64px 20px;font-size:13.5px}
  .carregando{display:flex;align-items:center;justify-content:center;gap:10px;
    color:var(--dim);padding:64px 20px;font-size:13.5px}
  .giro{width:13px;height:13px;border:2px solid #2b3238;border-top-color:var(--accent);
    border-radius:50%;animation:girar .7s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}

  .quadro{display:flex;gap:14px;align-items:flex-start;min-width:min-content}
  .coluna{
    background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);
    width:var(--col-w);flex:0 0 auto;display:flex;flex-direction:column;
    max-height:calc(100vh - 214px);transition:border-color var(--t),background var(--t)
  }
  .coluna.over{border-color:#3f6ea8;background:#141a21}
  .coluna .cabeca{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line)}
  .ponto{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .coluna .nome{font-size:12.5px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conta{font-size:11.5px;color:var(--dim);background:var(--sup-2);border-radius:20px;padding:1px 8px;
    font-variant-numeric:tabular-nums}
  /* min-height: colunas curtas não ficam em escadinha */
  .coluna .cartoes{padding:9px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:120px}
  .coluna .vazio{color:var(--dim);font-size:12px;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:var(--raio-s)}

  .cartao{
    background:var(--sup);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 11px;cursor:pointer;box-shadow:var(--sombra);
    transition:border-color var(--t),transform var(--t),opacity var(--t),background var(--t)
  }
  .cartao:hover{border-color:#343d46;transform:translateY(-1px);background:#1a1f24}
  .cartao.arrastando{opacity:.4}
  .cartao.ocupado{opacity:.55;pointer-events:none}
  .cartao .chave{font:600 11.5px ui-monospace,SFMono-Regular,Consolas,monospace;
    color:var(--accent);letter-spacing:.01em;display:flex;align-items:center;gap:6px}
  .cartao .sub{display:flex;align-items:center;gap:5px;margin-left:auto}
  .cartao .resumo{
    margin:6px 0 9px;font-size:13px;line-height:1.42;color:var(--txt);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word
  }
  .cartao .pessimo{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim)}
  .cartao .pessimo .pri{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .cartao .pessimo .data{margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
  .cartao .pessimo .data.atras{color:var(--err)}
  .fita{width:3px;height:12px;border-radius:2px;display:inline-block;flex:0 0 auto}
  .avatar{
    width:20px;height:20px;border-radius:50%;background:var(--sup-2);border:1px solid var(--line);
    color:var(--txt-2);font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;
    justify-content:center;flex:0 0 auto;text-transform:uppercase;overflow:hidden
  }
  .avatar.vazio{color:#4d565f;background:transparent;border-style:dashed}
  .avatar.g{width:26px;height:26px;font-size:12px}
  .pilula{font-size:10.5px;color:var(--txt-2);border:1px solid var(--line);border-radius:20px;
    padding:0 7px;background:var(--sup-2);white-space:nowrap;line-height:16px}
  .mais{font-size:11.5px;color:var(--dim);text-align:center;padding:7px;border:1px dashed var(--line);
    border-radius:var(--raio-s);cursor:pointer;transition:all var(--t)}
  .mais:hover{color:var(--txt);border-color:#343d46}

  /* --------------------------------- lista -------------------------------- */
  .lista-envolve{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg-2)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  th{color:var(--dim);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    background:var(--bg-2);cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;z-index:2}
  th:hover{color:var(--txt-2)}
  th .seta{color:var(--accent);font-size:10px;margin-left:4px}
  th.estatica{cursor:default}
  tbody tr{cursor:pointer;transition:background var(--t)}
  tbody tr:hover{background:var(--sup)}
  tbody tr:last-child td{border-bottom:0}
  td.k{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--accent);white-space:nowrap}
  td.resumo{max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.agora{white-space:nowrap;color:var(--txt-2);font-size:12.5px;font-variant-numeric:tabular-nums}
  .cel-resp{display:flex;align-items:center;gap:7px;white-space:nowrap;color:var(--txt-2)}
  .status-txt{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .pri-txt{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12.5px}

  /* -------------------------------- painel -------------------------------- */
  #fundo{position:fixed;inset:0;background:#05070ab8;backdrop-filter:blur(1px);
    opacity:0;pointer-events:none;transition:opacity var(--t);z-index:20}
  #fundo.on{opacity:1;pointer-events:auto}
  #painel{
    position:fixed;top:0;right:0;height:100%;width:min(620px,100vw);z-index:21;
    background:var(--bg-2);border-left:1px solid var(--line);box-shadow:var(--sombra-forte);
    display:flex;flex-direction:column;transform:translateX(102%);
    transition:transform 180ms cubic-bezier(.22,.61,.36,1)
  }
  #painel.on{transform:none}
  .p-cabeca{padding:14px 20px 0;border-bottom:1px solid var(--line);flex:0 0 auto}
  .p-linha{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .p-cabeca h2{margin:9px 0 0;font-size:15px;font-weight:600;line-height:1.4;word-break:break-word}
  .p-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:9px 0 11px;font-size:12px;color:var(--dim)}
  .abas{display:flex;gap:2px;overflow-x:auto}
  .aba{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;
    color:var(--dim);padding:8px 11px;font-size:12.5px;white-space:nowrap}
  .aba:hover:not(:disabled){color:var(--txt-2);background:none;border-color:transparent}
  .aba.on{color:var(--txt);border-bottom-color:var(--accent);font-weight:600}
  .p-corpo{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 30px}
  .p-pe{padding:11px 20px;border-top:1px solid var(--line);display:flex;gap:9px;
    justify-content:flex-end;align-items:center;flex:0 0 auto;background:var(--bg-2)}

  .bloco{margin-bottom:22px}
  .bloco:last-child{margin-bottom:4px}
  .bloco > h3{margin:0 0 10px;font-size:11.5px;font-weight:600;text-transform:uppercase;
    letter-spacing:.06em;color:var(--dim)}
  .campo{margin-bottom:13px}
  .campo > label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;
    text-transform:uppercase;letter-spacing:.05em}
  .campo input,.campo select,.campo textarea{width:100%}
  .campo textarea{min-height:120px;resize:vertical;line-height:1.5}
  .dois{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .ajuda{font-size:11.5px;color:var(--dim);margin-top:5px}
  .caixa{background:var(--sup);border:1px solid var(--line);border-radius:var(--raio-s);padding:11px 13px}
  .caixa.vazia{color:var(--dim);font-size:12.5px;border-style:dashed;background:transparent}
  .texto-longo{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.6;color:var(--txt-2)}

  .chip-status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
    background:var(--sup-2);border:1px solid var(--line);border-radius:20px;padding:4px 12px}
  .lista-simples{display:flex;flex-direction:column;gap:2px}
  .item-lista{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--raio-s);
    font-size:13px;transition:background var(--t)}
  .item-lista:hover{background:var(--sup)}
  .item-lista .k{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--accent);flex:0 0 auto}
  .item-lista .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt-2)}
  .item-lista .d{color:var(--dim);font-size:11.5px;white-space:nowrap}

  .comentario{border-top:1px solid var(--line-2);padding:12px 0}
  .comentario:first-child{border-top:0;padding-top:2px}
  .comentario .topo-c{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--dim)}
  .comentario .topo-c b{color:var(--txt-2);font-weight:600}
  .comentario .acoes-c{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity var(--t)}
  .comentario:hover .acoes-c{opacity:1}
  .comentario .corpo-c{white-space:pre-wrap;word-break:break-word;font-size:13px;color:var(--txt-2);
    padding-left:30px}
  .comentario .editar-c{margin:8px 0 0 30px;display:flex;flex-direction:column;gap:8px}
  .comentario .editar-c textarea{width:100%;min-height:90px;resize:vertical}
  .vetor{display:flex;gap:8px;justify-content:flex-end}
  .temporario{color:var(--dim);font-size:11px;font-style:italic}

  .anexo{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
    border-radius:var(--raio-s);background:var(--sup);margin-bottom:7px}
  .anexo .icone{width:28px;height:28px;border-radius:var(--raio-s);background:var(--sup-2);
    display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--dim);flex:0 0 auto}
  .anexo .nm{flex:1;min-width:0}
  .anexo .nm a{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
  .anexo .nm span{color:var(--dim);font-size:11.5px}
  .solta{border:1px dashed var(--line);border-radius:var(--raio-s);padding:14px;text-align:center;
    color:var(--dim);font-size:12.5px;transition:all var(--t)}
  .solta.por-cima{border-color:var(--accent);background:var(--accent-bg);color:var(--txt-2)}
  .solta input{display:none}

  .mudanca{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line-2);font-size:12.5px}
  .mudanca:first-child{border-top:0}
  .mudanca .quando{color:var(--dim);font-size:11.5px;white-space:nowrap}
  .mudanca .quem{color:var(--txt-2);font-weight:600;white-space:nowrap}
  .mudanca .campo-nome{color:var(--dim)}
  .de{color:var(--dim);text-decoration:line-through;text-decoration-color:#3a4249}
  .para{color:var(--txt)}
  .seta-m{color:var(--dim)}

  /* -------------------------------- modal --------------------------------- */
  #modal{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-start;justify-content:center;
    padding:52px 16px 32px;overflow-y:auto;background:#05070ab8;
    opacity:0;pointer-events:none;transition:opacity var(--t)}
  #modal.on{opacity:1;pointer-events:auto}
  .mcaixa{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;
    width:min(580px,100%);box-shadow:var(--sombra-forte);
    transform:translateY(-8px) scale(.99);transition:transform 180ms cubic-bezier(.22,.61,.36,1)}
  #modal.on .mcaixa{transform:none}
  .m-cabeca{padding:17px 22px 0}
  .m-cabeca h2{margin:0;font-size:15.5px;font-weight:600}
  .m-cabeca p{margin:5px 0 0;font-size:12.5px;color:var(--dim)}
  .m-corpo{padding:16px 22px 6px}
  .m-pe{padding:14px 22px 18px;display:flex;gap:9px;justify-content:flex-end;align-items:center}

  /* -------------------------------- toast ---------------------------------
     No topo e à direita de propósito: embaixo o toast cobria os botões do pé
     do painel e "Confirmar exclusão?" ficava impossível de clicar.        */
  #toasts{position:fixed;top:14px;right:18px;z-index:40;
    display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;max-width:min(430px,92vw)}
  .toast{
    background:var(--sup);border:1px solid var(--line);border-radius:var(--raio-s);
    padding:10px 15px;font-size:13px;box-shadow:var(--sombra-forte);max-width:100%;
    display:flex;align-items:center;gap:11px;pointer-events:auto;
    animation:desce 160ms ease-out
  }
  .toast.err{border-color:#5a2f2f}
  .toast .fita-t{width:3px;align-self:stretch;border-radius:2px;background:var(--ok);flex:0 0 auto}
  .toast.err .fita-t{background:var(--err)}
  .toast .msg{white-space:pre-wrap;word-break:break-word}
  .toast button{background:none;border:0;color:var(--accent);padding:0 2px;font-size:12.5px;font-weight:600}
  .toast button:hover:not(:disabled){background:none;text-decoration:underline}
  @keyframes desce{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }

  /* ----------------------------- responsivo ------------------------------- */
  @media (max-width:900px){
    header{padding:10px 14px 0}
    #vista{padding:13px 14px 26px}
    #busca{width:170px;max-width:46vw}
    .coluna{max-height:calc(100vh - 250px)}
    #painel{width:100vw}
    th.resumo-col,td.resumo{max-width:220px}
  }
  @media (max-width:620px){
    :root{--col-w:250px}
    .marca h1{font-size:14px}
    .topo{gap:8px}
    #busca{width:100%;max-width:none;order:9}
    .dois{grid-template-columns:1fr}
    th.ocultavel,td.ocultavel{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="topo">
    <div class="marca">
      <h1>Kanban</h1>
      <span class="tag-proj" id="tagProj">Jira</span>
    </div>
    <span class="contador" id="contador">carregando&hellip;</span>
    <div class="esp"></div>
    <input id="busca" type="search" placeholder="Buscar chave ou resumo&hellip;  ( / )" autocomplete="off">
    <a id="linkApp" class="link-app oculto" target="_blank" rel="noopener noreferrer"
       title="Abrir o app de conformidade (analise de processos)">App de conformidade &#8599;</a>
    <div class="seg" role="group" aria-label="Visão">
      <button id="vKanban" class="on" type="button">Kanban</button>
      <button id="vLista" type="button">Lista</button>
    </div>
    <button id="btnNova" class="prim" type="button">Nova tarefa</button>
    <button id="btnAtualizar" type="button" title="Reler do Jira">Atualizar</button>
  </div>

  <div class="filtros">
    <span class="rot">Tipo</span>
    <select id="fTipo" aria-label="Filtrar por tipo"></select>
    <span class="rot">Responsável</span>
    <select id="fResp" aria-label="Filtrar por responsável"></select>
    <span class="rot">Prioridade</span>
    <select id="fPri" aria-label="Filtrar por prioridade"></select>
    <span class="rot">Etiqueta</span>
    <select id="fLabel" aria-label="Filtrar por etiqueta"></select>
    <span class="esp"></span>
    <span class="inter" id="tAbertas" role="switch" aria-checked="false" tabindex="0">
      <span class="pt"></span>somente abertas
    </span>
    <button id="btnLimpar" class="limpo" type="button">Limpar filtros</button>
  </div>
</header>

<div id="palco"><div id="vista"></div></div>

<div id="fundo"></div>

<aside id="painel" role="dialog" aria-modal="true" aria-label="Detalhe da tarefa">
  <div class="p-cabeca">
    <div class="p-linha">
      <strong id="pChave" style="font:600 12.5px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--accent)"></strong>
      <span  id="pStatus"></span>
      <span class="esp"></span>
      <a id="pJira" class="mini" target="_blank" rel="noopener noreferrer">Abrir no Jira &#8599;</a>
      <button id="pFechar" class="mini" type="button">Fechar</button>
    </div>
    <h2 id="pTitulo"></h2>
    <div class="p-meta" id="pMeta"></div>
    <div class="abas" id="pAbas">
      <button class="aba on" data-aba="detalhes" type="button">Detalhes</button>
      <button class="aba" data-aba="comentarios" type="button">Comentários</button>
      <button class="aba" data-aba="anexos" type="button">Anexos</button>
      <button class="aba" data-aba="historico" type="button">Histórico</button>
    </div>
  </div>
  <div class="p-corpo" id="pCorpo"></div>
  <div class="p-pe" id="pPe"></div>
</aside>

<div id="modal" role="dialog" aria-modal="true" aria-label="Nova tarefa">
  <div class="mcaixa">
    <div class="m-cabeca">
      <h2>Nova tarefa em <span id="mProj">CON</span></h2>
      <p>A tarefa é criada no Jira de verdade.</p>
    </div>
    <div class="m-corpo">
      <div class="campo">
        <label for="cResumo">Resumo *</label>
        <input id="cResumo" placeholder="O que precisa ser feito?" autocomplete="off">
      </div>
      <div class="dois">
        <div class="campo"><label for="cTipo">Tipo</label><select id="cTipo"></select></div>
        <div class="campo"><label for="cPri">Prioridade</label><select id="cPri"></select></div>
      </div>
      <div class="dois">
        <div class="campo"><label for="cResp">Responsável</label><select id="cResp"></select></div>
        <div class="campo"><label for="cVenc">Vencimento</label><input id="cVenc" type="date"></div>
      </div>
      <div class="campo">
        <label for="cLabels">Etiquetas</label>
        <input id="cLabels" placeholder="separadas por vírgula" autocomplete="off">
      </div>
      <div class="campo">
        <label for="cPai">Pai / épico (opcional)</label>
        <input id="cPai" placeholder="ex.: CON-12" autocomplete="off">
        <div class="ajuda">Deixe vazio se não for subtarefa nem filha de épico.</div>
      </div>
      <div class="campo">
        <label for="cDesc">Descrição</label>
        <textarea id="cDesc" placeholder="Contexto, critérios de aceite&hellip;"></textarea>
      </div>
    </div>
    <div class="m-pe">
      <button id="cCancelar" type="button">Cancelar</button>
      <button id="cCriar" class="prim" type="button">Criar tarefa</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
(function () {
  'use strict';

  /* ======================================================================
     Estado
     ====================================================================== */
  var CHAVE_LS = 'kanban.con.v1';

  var S = {
    meta: null,
    eu: null,
    issues: [],
    view: 'kanban',
    filtros: { busca: '', tipo: '', responsavel: '', prioridade: '', label: '', abertas: false },
    ordens: { coluna: 'atualizado', dir: 'desc' },
    detalhe: null,          // issue detalhada aberta no painel
    aba: 'detalhes',
    concluidasAbertas: {},   // status -> mostra todas as concluídas
    ocupado: {}              // chave -> requisição em andamento
  };

  var $ = function (id) { return document.getElementById(id); };
  var vista = $('vista');

  /* Cor por categoria de status (catKey é estável: new / indeterminate / done) */
  var COR_CAT = { new: '#8a949e', indeterminate: '#5b9cf8', done: '#4fbf7f' };
  /* Cor por prioridade (a única outra cor com significado) */
  var COR_PRI = {
    Highest: '#f0716c', High: '#e0a45e', Medium: '#5b9cf8',
    Low: '#6f8fa8', Lowest: '#8a949e'
  };
  var ETIQUETAS_URGENTES = ['URGENT', 'VERY-URGENT', 'URGENTE'];

  /* ======================================================================
     Utilidades
     ====================================================================== */
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function semAcento(v) {
    return String(v == null ? '' : v).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }
  function txt(v, padrao) { return (v == null || v === '') ? (padrao || '') : String(v); }
  function lista(v) { return Array.isArray(v) ? v : []; }
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function data(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d.getTime())) return '';
    return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2);
  }
  function dataHora(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d.getTime())) return '';
    return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  function meiaNoite() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function atrasada(i) {
    if (!i || !i.vencimento || i.concluido) return false;
    var d = new Date(i.vencimento + 'T00:00:00');
    return !isNaN(d.getTime()) && d < meiaNoite();
  }
  function tamanho(bytes) {
    var n = Number(bytes) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }
  /* responsavel / relator agora são OBJETO {id,nome,email} ou null */
  function nomeDe(u) { return (u && u.nome) ? u.nome : ''; }
  function idDe(u) { return (u && u.id) ? u.id : ''; }
  function inicialDe(u) { var n = nomeDe(u); return n ? n.trim().charAt(0) : ''; }
  function primeiroNome(u) { var n = nomeDe(u); return n ? n.trim().split(/\s+/)[0] : ''; }
  function corPri(p) { return COR_PRI[p] || '#8a949e'; }
  function corDe(i) {
    var k = i && i.catKey;
    return COR_CAT[k] || (i && i.concluido ? COR_CAT.done : COR_CAT.new);
  }
  function categoriaDe(nomeStatus) {
    var s = lista(S.meta && S.meta.statuses).filter(function (x) { return x.nome === nomeStatus; })[0];
    return s || { nome: nomeStatus, categoria: '', catKey: '', concluido: false };
  }
  function achatar(arr) { return lista(arr).map(function (x) { return String(x); }).filter(function (x) { return x !== ''; }); }
  function virarArray(texto) {
    return String(texto || '').split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s !== ''; });
  }
  /* lista de valores únicos vindos das issues (fallback se o meta não trouxer) */
  function unicos(issues, campo) {
    var vistos = {};
    lista(issues).forEach(function (i) {
      lista(i[campo]).forEach(function (v) { if (v) vistos[v] = true; });
    });
    return Object.keys(vistos).sort();
  }

  function avatar(u, grande) {
    var cls = 'avatar' + (grande ? ' g' : '') + (nomeDe(u) ? '' : ' vazio');
    var titulo = nomeDe(u) ? ' title="' + esc(nomeDe(u)) + '"' : ' title="sem responsável"';
    return '<span class="' + cls + '"' + titulo + '>' + esc(inicialDe(u) || '–') + '</span>';
  }

  /* URL do app de conformidade, com o processo embutido quando existe. O app
     entende ?processo= (deep link); sem processo abre so a raiz dele. */
  function urlApp(processo) {
    var base = (S.meta && S.meta.app) || '';
    if (!base) return '';
    if (!processo) return base;
    var sep = base.indexOf('?') === -1 ? '?' : '&';
    return base + sep + 'processo=' + encodeURIComponent(processo);
  }

  /* ======================================================================
     Toast (fila: erros não se perdem atrás de um sucesso)
     ====================================================================== */
  function toast(msg, ehErro, acao) {
    var caixa = document.createElement('div');
    caixa.className = 'toast' + (ehErro ? ' err' : '');

    var fita = document.createElement('span');
    fita.className = 'fita-t';
    caixa.appendChild(fita);

    var m = document.createElement('span');
    m.className = 'msg';
    m.textContent = String(msg == null ? '' : msg);
    caixa.appendChild(m);

    if (acao) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = acao.rotulo;
      b.onclick = function () { remover(); acao.fazer(); };
      caixa.appendChild(b);
    }
    if (ehErro) {
      var x = document.createElement('button');
      x.type = 'button';
      x.textContent = 'Fechar';
      x.onclick = remover;
      caixa.appendChild(x);
    }

    var vivo = true;
    function remover() {
      if (!vivo) return; vivo = false;
      clearTimeout(t);
      caixa.style.transition = 'opacity 120ms ease';
      caixa.style.opacity = '0';
      setTimeout(function () { if (caixa.parentNode) caixa.parentNode.removeChild(caixa); }, 130);
    }
    var t = setTimeout(remover, ehErro ? 11000 : 4500);

    $('toasts').appendChild(caixa);
    while ($('toasts').children.length > 4) $('toasts').removeChild($('toasts').firstChild);
  }

  /* ======================================================================
     Camada de API — toda falha vira Error com a mensagem do servidor
     ====================================================================== */
  function api(caminho, opcoes) {
    var cfg = opcoes || {};
    if (cfg.corpo !== undefined) {
      cfg.method = cfg.method || 'POST';
      cfg.headers = { 'Content-Type': 'application/json' };
      cfg.body = JSON.stringify(cfg.corpo);
      delete cfg.corpo;
    }
    return fetch(caminho, cfg).then(function (r) {
      return r.text().then(function (t) {
        var d = null;
        try { d = t ? JSON.parse(t) : null; } catch (e) { d = null; }
        if (!r.ok || !d || d.ok === false) {
          throw new Error((d && d.error) || ('Falha na requisição (HTTP ' + r.status + ')'));
        }
        return d;
      });
    }, function () {
      throw new Error('Não foi possível falar com o servidor local.');
    });
  }

  function comoMensagem(e) { return (e && e.message) ? e.message : String(e); }

  /* ======================================================================
     Filtros
     ====================================================================== */
  function passaFiltros(i) {
    var f = S.filtros;
    var busca = semAcento(f.busca.trim());
    if (busca) {
      var alvo = semAcento(i.key + ' ' + i.summary + ' ' + nomeDe(i.responsavel) + ' ' + lista(i.labels).join(' '));
      if (alvo.indexOf(busca) < 0) return false;
    }
    if (f.tipo && i.tipo !== f.tipo) return false;
    if (f.responsavel) {
      if (f.responsavel === '__ninguem__') { if (nomeDe(i.responsavel)) return false; }
      else if (idDe(i.responsavel) !== f.responsavel) return false;
    }
    if (f.prioridade && i.prioridade !== f.prioridade) return false;
    if (f.label && lista(i.labels).indexOf(f.label) < 0) return false;
    if (f.abertas && i.concluido) return false;
    return true;
  }
  function filtradas() { return S.issues.filter(passaFiltros); }

  function salvarPreferencias() {
    try {
      localStorage.setItem(CHAVE_LS, JSON.stringify({ view: S.view, filtros: S.filtros }));
    } catch (e) { /* modo privado: ignora */ }
  }
  function lerPreferencias() {
    try {
      var v = JSON.parse(localStorage.getItem(CHAVE_LS) || '{}');
      if (v && v.view === 'lista') S.view = 'lista';
      if (v && v.filtros) {
        Object.keys(S.filtros).forEach(function (k) { if (k in v.filtros) S.filtros[k] = v.filtros[k]; });
      }
    } catch (e) { /* ignora */ }
  }

  /* ======================================================================
     Quadro — colunas por status
     ====================================================================== */
  function colunasComItens(listaBruta) {
    var ordem = lista(S.meta && S.meta.statuses).map(function (s) { return s.nome; });
    var presentes = [];
    listaBruta.forEach(function (i) { if (i.status && presentes.indexOf(i.status) < 0) presentes.push(i.status); });
    var cols = ordem.filter(function (n) { return presentes.indexOf(n) >= 0; });
    presentes.forEach(function (n) { if (cols.indexOf(n) < 0) cols.push(n); });
    return cols;
  }

  function cartaoHTML(i) {
    var atras = atrasada(i);
    var categoria = categoriaDe(i.status);
    var etiquetas = lista(i.labels);
    var sub = i.subtarefa ? '<span class="pilula" title="Subtarefa">sub</span>' : '';
    var etiq = etiquetas.length
      ? '<span class="pilula" title="' + esc(etiquetas.join(', ')) + '">' + esc(etiquetas[0]) +
        (etiquetas.length > 1 ? ' +' + (etiquetas.length - 1) : '') + '</span>'
      : '';
    var pri = i.prioridade
      ? '<span class="pri"><span class="fita" style="background:' + corPri(i.prioridade) + '"></span>' + esc(i.prioridade) + '</span>'
      : '<span class="pri" style="color:#5d666f">&ndash;</span>';
    var quando = i.vencimento ? (atras ? 'vence ' : '') + data(i.vencimento) : (i.atualizado ? data(i.atualizado) : '');

    return '' +
      '<article class="cartao' + (S.ocupado[i.key] ? ' ocupado' : '') + '" draggable="true" data-key="' + esc(i.key) + '" ' +
        'tabindex="0" role="button" aria-label="' + esc(i.key + ' ' + i.summary) + '">' +
        '<div class="chave"><span class="ponto" style="background:' + corDe(categoria) + '"></span>' + esc(i.key) +
          '<span class="sub">' + sub + etiq + '</span></div>' +
        '<div class="resumo">' + esc(i.summary || '(sem resumo)') + '</div>' +
        '<div class="pessimo">' + avatar(i.responsavel) +
          '<span class="pessimo-nome" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:96px">' +
            esc(primeiroNome(i.responsavel) || 'sem responsável') + '</span>' +
          pri +
          '<span class="data' + (atras ? ' atras' : '') + '" title="' + esc(atras ? 'vencido em ' + data(i.vencimento) : (i.vencimento ? 'vence em ' + data(i.vencimento) : 'atualizado em ' + dataHora(i.atualizado))) + '">' +
            esc(quando) + '</span>' +
        '</div>' +
      '</article>';
  }

  function renderKanban(lista) {
    var cols = colunasComItens(lista);
    if (!cols.length) {
      vista.innerHTML = '<div class="aviso-vazio">Nenhuma tarefa para mostrar.</div>';
      return;
    }

    var html = '<div class="quadro">';
    cols.forEach(function (status) {
      var doStatus = lista.filter(function (i) { return i.status === status; });
      var info = categoriaDe(status);
      var limite = 30;
      var excedeu = info.concluido && !S.concluidasAbertas[status] && doStatus.length > limite;
      var visiveis = excedeu ? doStatus.slice(0, limite) : doStatus;

      html += '<section class="coluna" data-status="' + esc(status) + '">' +
        '<div class="cabeca"><span class="ponto" style="background:' + corDe(info) + '"></span>' +
          '<span class="nome" title="' + esc(status) + '">' + esc(status) + '</span>' +
          '<span class="conta">' + doStatus.length + '</span></div>' +
        '<div class="cartoes">';

      if (!visiveis.length) {
        html += '<div class="vazio">nada aqui</div>';
      } else {
        html += visiveis.map(cartaoHTML).join('');
      }
      if (excedeu) {
        html += '<div class="mais" data-mais="' + esc(status) + '">+ ' + (doStatus.length - limite) + ' ocultas &middot; mostrar</div>';
      } else if (info.concluido && S.concluidasAbertas[status] && doStatus.length > limite) {
        html += '<div class="mais" data-menos="' + esc(status) + '">ocultar concluídas</div>';
      }
      html += '</div></section>';
    });
    html += '</div>';
    vista.innerHTML = html;
  }

  /* ======================================================================
     Lista — tabela ordenável
     ====================================================================== */
  var COLUNAS_LISTA = [
    { id: 'key', rotulo: 'Chave' },
    { id: 'summary', rotulo: 'Resumo' },
    { id: 'status', rotulo: 'Status' },
    { id: 'prioridade', rotulo: 'Prioridade' },
    { id: 'tipo', rotulo: 'Tipo', ocultavel: true },
    { id: 'responsavel', rotulo: 'Responsável' },
    { id: 'vencimento', rotulo: 'Vencimento', ocultavel: true },
    { id: 'atualizado', rotulo: 'Atualizado' }
  ];

  function ordenar(lista) {
    var c = S.ordens.coluna, dir = S.ordens.dir === 'asc' ? 1 : -1;
    var copia = lista.slice();
    copia.sort(function (a, b) {
      var va, vb;
      if (c === 'responsavel') { va = semAcento(nomeDe(a.responsavel)); vb = semAcento(nomeDe(b.responsavel)); }
      else if (c === 'prioridade') { va = pesoPrioridade(a.prioridade); vb = pesoPrioridade(b.prioridade); }
      else if (c === 'key') { va = pesoChave(a.key); vb = pesoChave(b.key); }
      else { va = String(a[c] || ''); vb = String(b[c] || ''); }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return String(a.key).localeCompare(String(b.key));
    });
    return copia;
  }
  function pesoPrioridade(p) {
    var ordem = { Highest: 5, High: 4, Medium: 3, Low: 2, Lowest: 1 };
    return ordem[p] || 0;
  }
  function pesoChave(k) {
    var m = String(k || '').match(/^([A-Za-z]+)-(\d+)$/);
    return m ? m[1] + '-' + ('000000' + m[2]).slice(-6) : String(k || '');
  }

  function renderLista(lista) {
    if (!lista.length) {
      vista.innerHTML = '<div class="aviso-vazio">Nenhuma tarefa para mostrar.</div>';
      return;
    }
    var linhas = ordenar(lista);
    var cabecalho = COLUNAS_LISTA.map(function (col) {
      var seta = S.ordens.coluna === col.id ? '<span class="seta">' + (S.ordens.dir === 'asc' ? '\u25B2' : '\u25BC') + '</span>' : '';
      return '<th class="' + (col.ocultavel ? 'ocultavel' : '') + '" data-ordem="' + col.id + '">' + esc(col.rotulo) + seta + '</th>';
    }).join('');

    var corpo = linhas.map(function (i) {
      var info = categoriaDe(i.status);
      var pri = i.prioridade
        ? '<span class="pri-txt"><span class="fita" style="background:' + corPri(i.prioridade) + '"></span>' + esc(i.prioridade) + '</span>'
        : '<span style="color:#5d666f">&ndash;</span>';
      var venc = i.vencimento
        ? '<span' + (atrasada(i) ? ' style="color:var(--err)"' : '') + '>' + esc(data(i.vencimento)) + '</span>'
        : '<span style="color:#5d666f">&ndash;</span>';
      return '<tr data-key="' + esc(i.key) + '">' +
        '<td class="k">' + esc(i.key) + '</td>' +
        '<td class="resumo">' + esc(i.summary || '(sem resumo)') + '</td>' +
        '<td><span class="status-txt"><span class="ponto" style="background:' + corDe(info) + '"></span>' + esc(i.status || '\u2013') + '</span></td>' +
        '<td>' + pri + '</td>' +
        '<td class="ocultavel">' + esc(i.tipo || '\u2013') + '</td>' +
        '<td><span class="cel-resp">' + avatar(i.responsavel) + (esc(primeiroNome(i.responsavel)) || '\u2013') + '</span></td>' +
        '<td class="ocultavel agora">' + venc + '</td>' +
        '<td class="agora">' + esc(data(i.atualizado) || '\u2013') + '</td>' +
        '</tr>';
    }).join('');

    vista.innerHTML = '<div class="lista-envolve"><table><thead><tr>' + cabecalho +
      '</tr></thead><tbody>' + corpo + '</tbody></table></div>';
  }

  /* ======================================================================
     Render geral
     ====================================================================== */
  function renderContador(lista) {
    var abertas = lista.filter(function (i) { return !i.concluido; }).length;
    var total = lista.length;
    var sufixo = total !== S.issues.length ? ' de ' + S.issues.length : '';
    $('contador').innerHTML = '<b>' + abertas + '</b> abertas / ' + total + ' total' + esc(sufixo);
  }

  function render() {
    if (!S.meta) return;
    var lista = filtradas();
    renderContador(lista);
    if (!S.issues.length) {
      vista.innerHTML = '<div class="aviso-vazio">O projeto ainda não tem tarefas.</div>';
      return;
    }
    if (S.view === 'lista') renderLista(lista); else renderKanban(lista);
  }

  function carregando(msg) {
    vista.innerHTML = '<div class="carregando"><span class="giro"></span>' + esc(msg || 'lendo o Jira…') + '</div>';
  }

  /* ======================================================================
     Arrastar e soltar
     ====================================================================== */
  var arrastando = null;

  vista.addEventListener('dragstart', function (ev) {
    var c = ev.target.closest ? ev.target.closest('.cartao') : null;
    if (!c) return;
    arrastando = c.dataset.key;
    ev.dataTransfer.setData('text/plain', c.dataset.key);
    ev.dataTransfer.effectAllowed = 'move';
    c.classList.add('arrastando');
  });
  vista.addEventListener('dragend', function (ev) {
    var c = ev.target.closest ? ev.target.closest('.cartao') : null;
    if (c) c.classList.remove('arrastando');
    setTimeout(function () { arrastando = null; }, 60);
  });
  vista.addEventListener('dragover', function (ev) {
    var col = ev.target.closest ? ev.target.closest('.coluna') : null;
    if (!col) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    col.classList.add('over');
  });
  vista.addEventListener('dragleave', function (ev) {
    var col = ev.target.closest ? ev.target.closest('.coluna') : null;
    if (!col) return;
    if (!col.contains(ev.relatedTarget)) col.classList.remove('over');
  });
  vista.addEventListener('drop', function (ev) {
    var col = ev.target.closest ? ev.target.closest('.coluna') : null;
    if (!col) return;
    ev.preventDefault();
    col.classList.remove('over');
    var key = ev.dataTransfer.getData('text/plain') || arrastando;
    if (key) mover(key, col.dataset.status);
  });

  /* ======================================================================
     Mover de coluna
     ====================================================================== */
  function mover(key, destino) {
    var i = S.issues.filter(function (x) { return x.key === key; })[0];
    if (!i || !destino || i.status === destino) return;
    var de = i.status;
    var catAntes = { status: i.status, categoria: i.categoria, catKey: i.catKey, concluido: i.concluido };
    var info = categoriaDe(destino);

    /* otimista: reflete já e desfaz se o Jira recusar */
    i.status = destino; i.categoria = info.categoria; i.catKey = info.catKey; i.concluido = !!info.concluido;
    render();

    api('/api/move', { corpo: { key: key, to: destino } }).then(function (r) {
      if (r && r.mudou === false) toast(key + ' já estava em "' + destino + '".');
      else toast(key + ' \u2192 ' + destino, false, {
        rotulo: 'Desfazer',
        fazer: function () { mover(key, de); }
      });
      /* a data de atualização muda no Jira: recarrega em segundo plano */
      recarregar(true);
    }).catch(function (e) {
      i.status = catAntes.status; i.categoria = catAntes.categoria;
      i.catKey = catAntes.catKey; i.concluido = catAntes.concluido;
      render();
      toast('Não foi possível mover ' + key + ': ' + comoMensagem(e), true);
    });
  }

  /* ======================================================================
     Painel de detalhe
     ====================================================================== */
  function abrirDetalhe(key, aba) {
    S.detalhe = null;
    S.aba = aba || S.aba || 'detalhes';
    $('painel').classList.add('on');
    $('fundo').classList.add('on');
    $('pChave').textContent = key;
    $('pTitulo').textContent = '';
    $('pStatus').innerHTML = '';
    $('pMeta').innerHTML = '';
    $('pJira').removeAttribute('href');
    $('pPe').innerHTML = '';
    $('pAbas').classList.add('oculto');
    $('pCorpo').innerHTML = '<div class="carregando"><span class="giro"></span>abrindo ' + esc(key) + '…</div>';

    api('/api/issue?key=' + encodeURIComponent(key)).then(function (d) {
      S.detalhe = d;
      pintarCabecalho(d);
      renderAba();
    }).catch(function (e) {
      $('pCorpo').innerHTML = '<div class="aviso-vazio">Erro ao abrir ' + esc(key) + ':<br>' + esc(comoMensagem(e)) + '</div>';
    });
  }

  function fecharDetalhe() {
    $('painel').classList.remove('on');
    if (!$('modal').classList.contains('on')) $('fundo').classList.remove('on');
    S.detalhe = null;
    S.aba = 'detalhes';
  }

  function pintarCabecalho(d) {
    var info = categoriaDe(d.status);
    $('pChave').textContent = d.key;
    $('pTitulo').textContent = d.summary || '(sem resumo)';
    $('pStatus').innerHTML = '<span class="chip-status" style="color:' + corDe(info) + '">' +
      '<span class="ponto" style="background:' + corDe(info) + '"></span>' + esc(d.status || '\u2013') + '</span>';

    var partes = [];
    if (d.tipo) partes.push(esc(d.tipo));
    if (d.prioridade) partes.push('<span style="color:' + corPri(d.prioridade) + '">' + esc(d.prioridade) + '</span>');
    if (nomeDe(d.responsavel)) partes.push('resp. ' + esc(nomeDe(d.responsavel)));
    if (d.vencimento) {
      partes.push((atrasada(d) ? '<span style="color:var(--err)">vence ' : '<span>vence ') + esc(data(d.vencimento)) + '</span>');
    }
    partes.push('atualizado ' + esc(dataHora(d.atualizado)));
    $('pMeta').innerHTML = partes.join('<span style="color:#3a4249">&middot;</span>');

    var link = d.url || ((S.meta && S.meta.site) ? S.meta.site + '/browse/' + d.key : '');
    if (link) $('pJira').href = link; else $('pJira').classList.add('oculto');
    $('pAbas').classList.remove('oculto');
    Array.prototype.forEach.call($('pAbas').querySelectorAll('.aba'), function (b) {
      b.classList.toggle('on', b.dataset.aba === S.aba);
    });
  }

  function renderAba() {
    var d = S.detalhe;
    if (!d) return;
    if (S.aba === 'comentarios') return pintarComentarios(d);
    if (S.aba === 'anexos') return pintarAnexos(d);
    if (S.aba === 'historico') return pintarHistorico(d);
    return pintarDetalhes(d);
  }

  /* ----------------------------- aba Detalhes ---------------------------- */
  function pintarDetalhes(d) {
    /* O value e o ID do tipo (nao o nome): e o ID que /api/update espera em
       `tipoId`. Comparar por id tambem evita o select cair no primeiro item
       quando o nome vier com acento ou espaco diferente. */
    var tipos = lista(S.meta && S.meta.tipos).filter(function (t) { return !t.subtarefa; })
      .map(function (t) { return '<option value="' + esc(t.id) + '"' + (t.id === d.tipoId ? ' selected' : '') + '>' + esc(t.nome) + '</option>'; }).join('');
    var prios = lista(S.meta && S.meta.prioridades).map(function (p) {
      return '<option value="' + esc(p) + '"' + (p === d.prioridade ? ' selected' : '') + '>' + esc(p) + '</option>';
    }).join('');
    var usuarios = '<option value="">— sem responsável —</option>' + lista(S.meta && S.meta.usuarios).map(function (u) {
      return '<option value="' + esc(u.id) + '"' + (u.id === idDe(d.responsavel) ? ' selected' : '') + '>' + esc(u.nome) + '</option>';
    }).join('');

    var transicoes = lista(d.transicoes);
    var opcoesTransicao = '<option value="">mover para…</option>' + transicoes.map(function (t) {
      return '<option value="' + esc(t.para || t.nome) + '">' + esc(t.para || t.nome) + '</option>';
    }).join('');
    var blocoTransicao = transicoes.length
      ? '<div class="campo"><label for="eTransicao">Trocar status</label><select id="eTransicao">' + opcoesTransicao + '</select>' +
        '<div class="ajuda">As opções são as transições realmente disponíveis neste status.</div></div>'
      : '<div class="campo"><label>Trocar status</label><div class="caixa vazia">O Jira não oferece transições a partir de "' +
        esc(d.status) + '".</div></div>';

    var pai = d.pai
      ? '<div class="item-lista" style="padding-left:0"><span class="k">' + esc(d.pai.key) + '</span>' +
        '<span class="t">' + esc(d.pai.summary || '') + '</span>' +
        '<button class="mini" type="button" data-abrir="' + esc(d.pai.key) + '">abrir</button></div>'
      : '<div class="caixa vazia">Sem pai / épico.</div>';

    var filhas = lista(d.filhas);
    var blocoFilhas = filhas.length
      ? '<div class="lista-simples">' + filhas.map(function (f) {
          return '<div class="item-lista"><span class="k">' + esc(f.key) + '</span>' +
            '<span class="t" title="' + esc(f.summary) + '">' + esc(f.summary || '') + '</span>' +
            '<span class="d">' + esc(f.status || '') + '</span>' +
            '<button class="mini" type="button" data-abrir="' + esc(f.key) + '">abrir</button></div>';
        }).join('') + '</div>'
      : '<div class="caixa vazia">Nenhuma subtarefa.</div>';

    var links = lista(d.links);
    var blocoLinks = links.length
      ? '<div class="lista-simples">' + links.map(function (l) {
          return '<div class="item-lista"><span class="d">' + esc(l.tipo || (l.direcao === 'saida' ? 'liga para' : 'ligada por')) + '</span>' +
            '<span class="k">' + esc(l.key) + '</span>' +
            '<span class="t" title="' + esc(l.summary) + '">' + esc(l.summary || '') + '</span>' +
            '<span class="d">' + esc(l.status || '') + '</span>' +
            '<button class="mini" type="button" data-abrir="' + esc(l.key) + '">abrir</button></div>';
        }).join('') + '</div>'
      : '';

    var etiquetas = lista(d.labels);
    var componentes = lista(d.componentes);
    var processo = txt(d.processo);

    $('pCorpo').innerHTML = '' +
      '<div class="bloco"><h3>Editar</h3>' +
        '<div class="campo"><label for="eResumo">Resumo</label>' +
          '<input id="eResumo" value="' + esc(d.summary) + '"></div>' +
        '<div class="campo"><label for="eDesc">Descrição</label>' +
          '<textarea id="eDesc" placeholder="(sem descrição)">' + esc(d.descricao) + '</textarea></div>' +
        '<div class="dois">' +
          '<div class="campo"><label for="ePri">Prioridade</label><select id="ePri">' + prios + '</select></div>' +
          '<div class="campo"><label for="eVenc">Vencimento</label>' +
            '<input id="eVenc" type="date" value="' + esc(d.vencimento || '') + '"></div>' +
        '</div>' +
        '<div class="campo"><label for="eResp">Responsável</label><select id="eResp">' + usuarios + '</select></div>' +
        '<div class="dois">' +
          '<div class="campo"><label for="eTipo">Tipo</label><select id="eTipo">' + tipos + '</select></div>' +
          '<div class="campo"><label for="ePai">Pai / épico (chave)</label>' +
            '<input id="ePai" value="' + esc(d.pai ? d.pai.key : '') + '" placeholder="ex.: CON-12"></div>' +
        '</div>' +
        '<div class="campo"><label for="eLabels">Etiquetas</label>' +
          '<input id="eLabels" value="' + esc(etiquetas.join(', ')) + '" placeholder="separadas por vírgula">' +
          '<div class="ajuda">Sugestões do projeto: ' +
            (lista(S.meta && S.meta.labels).length ? esc(lista(S.meta.labels).join(', ')) : 'nenhuma ainda') + '</div></div>' +
        '<div class="campo"><label for="eComp">Componentes</label>' +
          '<input id="eComp" value="' + esc(componentes.join(', ')) + '" placeholder="separados por vírgula">' +
          '<div class="ajuda">Sugestões do projeto: ' +
            (lista(S.meta && S.meta.componentes).length ? esc(lista(S.meta.componentes).join(', ')) : 'nenhum ainda') + '</div></div>' +
        blocoTransicao +
      '</div>' +

      '<div class="bloco"><h3>Vínculos</h3>' +
        '<div class="campo"><label>Pai</label>' + pai + '</div>' +
        '<div class="campo"><label>Subtarefas (' + filhas.length + ')</label>' + blocoFilhas + '</div>' +
        (blocoLinks ? '<div class="campo"><label>Links</label>' + blocoLinks + '</div>' : '') +
        '<div class="campo"><label>No Jira</label>' +
          '<div class="vetor" style="justify-content:flex-start;flex-wrap:wrap">' +
            (txt(d.url) ? '<a class="mini" href="' + esc(d.url) + '" target="_blank" rel="noopener noreferrer">Abrir no Jira &#8599;</a>' : '') +
            (processo && S.meta && S.meta.app
              ? '<a class="mini" href="' + esc(urlApp(processo)) + '" target="_blank" rel="noopener noreferrer">Abrir no app de conformidade &#8599;</a>'
              : '') +
          '</div>' +
          (processo ? '<div class="ajuda">Processo detectado: <b>' + esc(processo) + '</b></div>' : '') +
        '</div>' +
      '</div>' +

      '<div class="bloco"><h3>Registro</h3>' +
        '<div class="caixa" style="font-size:12.5px;color:var(--dim)">' +
          'Criado em ' + (esc(dataHora(d.criado)) || '\u2013') +
          ' por ' + esc(nomeDe(d.relator) || 'desconhecido') + '<br>' +
          'Última atualização em ' + (esc(dataHora(d.atualizado)) || '\u2013') +
          (d.concluido && d.resolvido ? '<br>Concluído em ' + esc(dataHora(d.resolvido)) : '') +
          (d.tempo && (d.tempo.original || d.tempo.gasto)
            ? '<br>Tempo: ' + esc(d.tempo.gasto || '0m') + ' gasto' + (d.tempo.original ? ' de ' + esc(d.tempo.original) : '')
            : '') +
        '</div>' +
      '</div>';

    $('pPe').innerHTML =
      '<button id="eExcluir" class="perigo" type="button">Excluir tarefa</button>' +
      '<span class="esp"></span>' +
      '<button id="eSalvar" class="prim" type="button">Salvar alterações</button>';

    $('eSalvar').onclick = salvarDetalhe;
    $('eExcluir').onclick = confirmarExclusao;
    var sel = $('eTransicao');
    if (sel) sel.onchange = function () { if (sel.value) trocarStatus(sel.value, sel); };
  }

  /* ------------------------- salvar só o que mudou ----------------------- */
  function salvarDetalhe() {
    var d = S.detalhe;
    if (!d) return;
    var campos = {};
    var resumo = $('eResumo').value.trim();
    if (!resumo) { toast('O resumo não pode ficar vazio.', true); return; }
    if (resumo !== d.summary) campos.summary = resumo;
    if ($('eDesc').value !== (d.descricao || '')) campos.descricao = $('eDesc').value;
    if ($('ePri').value !== (d.prioridade || '')) campos.priority = $('ePri').value;
    if ($('eVenc').value !== (d.vencimento || '')) campos.duedate = $('eVenc').value;
    if ($('eResp').value !== idDe(d.responsavel)) campos.assigneeAccountId = $('eResp').value;
    if ($('ePai').value.trim() !== (d.pai ? d.pai.key : '')) campos.parentKey = $('ePai').value.trim();
    /* Tipo: sem esta linha o select era editavel mas a mudanca era descartada
       em silencio. O servidor aceita `tipoId` e mapeia para fields.issuetype. */
    if ($('eTipo').value !== (d.tipoId || '')) campos.tipoId = $('eTipo').value;

    var novasEtiquetas = virarArray($('eLabels').value);
    if (novasEtiquetas.join('\u0000') !== lista(d.labels).join('\u0000')) campos.labels = novasEtiquetas;
    var novosComponentes = virarArray($('eComp').value);
    if (novosComponentes.join('\u0000') !== lista(d.componentes).join('\u0000')) campos.componentes = novosComponentes;

    if (!Object.keys(campos).length) { toast('Nada mudou.'); return; }

    var botao = $('eSalvar');
    botao.disabled = true; botao.textContent = 'Salvando…';
    api('/api/update', { corpo: { key: d.key, campos: campos } }).then(function (r) {
      toast(d.key + ' salva' + (r && r.alterado === false ? ' (nada a alterar no Jira)' : ''));
      recarregar(true);
      return api('/api/issue?key=' + encodeURIComponent(d.key)).then(function (novo) {
        S.detalhe = novo;
        pintarCabecalho(novo);
        renderAba();
      });
    }).catch(function (e) {
      toast('Erro ao salvar ' + d.key + ': ' + comoMensagem(e), true);
    }).then(function () {
      if ($('eSalvar') === botao) { botao.disabled = false; botao.textContent = 'Salvar alterações'; }
    });
  }

  function trocarStatus(destino, sel) {
    var d = S.detalhe;
    if (!d) return;
    sel.disabled = true;
    api('/api/move', { corpo: { key: d.key, to: destino } }).then(function () {
      toast(d.key + ' \u2192 ' + destino);
      recarregar(true);
      return api('/api/issue?key=' + encodeURIComponent(d.key)).then(function (novo) {
        S.detalhe = novo;
        pintarCabecalho(novo);
        renderAba();
      });
    }).catch(function (e) {
      toast('Não foi possível mover ' + d.key + ': ' + comoMensagem(e), true);
      if (sel) { sel.value = ''; sel.disabled = false; }
      return api('/api/issue?key=' + encodeURIComponent(d.key)).then(function (novo) {
        S.detalhe = novo; renderAba();
      }).catch(function () { /* mantém o painel como está */ });
    });
  }

  function confirmarExclusao() {
    var d = S.detalhe;
    if (!d) return;
    var botao = $('eExcluir');
    if (botao.dataset.confirmando === '1') {
      botao.disabled = true; botao.textContent = 'Excluindo…';
      api('/api/delete', { corpo: { key: d.key } }).then(function () {
        toast(d.key + ' excluída.');
        fecharDetalhe();
        recarregar(true);
      }).catch(function (e) {
        toast('Erro ao excluir ' + d.key + ': ' + comoMensagem(e), true);
        botao.disabled = false; botao.textContent = 'Excluir tarefa';
        delete botao.dataset.confirmando;
      });
      return;
    }
    botao.dataset.confirmando = '1';
    botao.textContent = 'Confirmar exclusão?';
    toast('Clique de novo em "Confirmar exclusão?" para apagar ' + d.key + ' no Jira.', true);
    setTimeout(function () {
      if (botao && botao.dataset.confirmando === '1' &&
          document.body.contains(botao)) {
        delete botao.dataset.confirmando;
        botao.textContent = 'Excluir tarefa';
      }
    }, 8000);
  }

  /* ---------------------------- aba Comentários -------------------------- */
  function pintarComentarios(d) {
    var listaC = lista(d.comentarios);
    var html = '<div class="bloco"><h3>Novo comentário</h3>' +
      '<div class="campo"><textarea id="novoComent" placeholder="Escreva o comentário…"></textarea></div>' +
      '<div class="vetor"><button id="bComentar" class="prim" type="button">Comentar</button></div></div>' +
      '<div class="bloco"><h3>Comentários (' + listaC.length + ')</h3>';

    html += listaC.length ? listaC.map(function (c) {
      var editado = c.atualizado && c.quando && c.atualizado !== c.quando;
      return '<div class="comentario" data-coment="' + esc(c.id) + '">' +
        '<div class="topo-c">' + avatar({ nome: c.autor }) +
          '<b>' + esc(c.autor || 'desconhecido') + '</b>' +
          '<span>' + esc(dataHora(c.quando)) + '</span>' +
          (editado ? '<span class="temporario">&middot; editado</span>' : '') +
          '<span class="acoes-c">' +
            '<button class="limpo" type="button" data-editar="' + esc(c.id) + '">editar</button>' +
            '<button class="limpo" type="button" data-excluir="' + esc(c.id) + '">excluir</button>' +
          '</span>' +
        '</div>' +
        '<div class="corpo-c" id="corpo-c-' + esc(c.id) + '">' + esc(c.texto) + '</div>' +
      '</div>';
    }).join('') : '<div class="caixa vazia">Nenhum comentário ainda.</div>';

    html += '</div>';
    $('pCorpo').innerHTML = html;
    $('pPe').innerHTML = '';

    $('bComentar').onclick = function () {
      var t = $('novoComent').value.trim();
      if (!t) { toast('Escreva algo antes de comentar.', true); return; }
      var b = $('bComentar');
      b.disabled = true; b.textContent = 'Enviando…';
      api('/api/comment', { corpo: { key: d.key, texto: t } }).then(function () {
        toast('Comentário adicionado em ' + d.key);
        return recarregarDetalhe();
      }).catch(function (e) {
        toast('Erro ao comentar: ' + comoMensagem(e), true);
        b.disabled = false; b.textContent = 'Comentar';
      });
    };
  }

  function cliqueComentario(ev) {
    var d = S.detalhe;
    if (!d) return;
    var alvoEditar = ev.target.closest ? ev.target.closest('[data-editar]') : null;
    var alvoExcluir = ev.target.closest ? ev.target.closest('[data-excluir]') : null;

    if (alvoEditar) {
      var id = alvoEditar.dataset.editar;
      var c = lista(d.comentarios).filter(function (x) { return String(x.id) === String(id); })[0];
      if (!c) return;
      var corpo = $('corpo-c-' + id);
      if (!corpo || $('ed-' + id)) return;
      var caixa = document.createElement('div');
      caixa.className = 'editar-c';
      caixa.id = 'ed-' + id;
      caixa.innerHTML = '<textarea></textarea>' +
        '<div class="vetor"><button class="limpo" type="button" data-cancelar="' + esc(id) + '">Cancelar</button>' +
        '<button class="prim mini" type="button" data-salvar="' + esc(id) + '">Salvar comentário</button></div>';
      caixa.querySelector('textarea').value = c.texto;
      corpo.parentNode.appendChild(caixa);
      caixa.querySelector('textarea').focus();
      return;
    }

    var alvoSalvar = ev.target.closest ? ev.target.closest('[data-salvar]') : null;
    if (alvoSalvar) {
      var idS = alvoSalvar.dataset.salvar;
      var cx = $('ed-' + idS);
      var texto = cx ? cx.querySelector('textarea').value : '';
      if (!texto.trim()) { toast('O comentário não pode ficar vazio.', true); return; }
      alvoSalvar.disabled = true; alvoSalvar.textContent = 'Salvando…';
      api('/api/comment.edit', { corpo: { key: d.key, id: idS, texto: texto } }).then(function () {
        toast('Comentário atualizado.');
        return recarregarDetalhe();
      }).catch(function (e) {
        toast('Erro ao editar comentário: ' + comoMensagem(e), true);
        alvoSalvar.disabled = false; alvoSalvar.textContent = 'Salvar comentário';
      });
      return;
    }

    var alvoCancelar = ev.target.closest ? ev.target.closest('[data-cancelar]') : null;
    if (alvoCancelar) {
      var cx2 = $('ed-' + alvoCancelar.dataset.cancelar);
      if (cx2) cx2.remove();
      return;
    }

    if (alvoExcluir) {
      var idX = alvoExcluir.dataset.excluir;
      if (alvoExcluir.dataset.confirmando !== '1') {
        alvoExcluir.dataset.confirmando = '1';
        alvoExcluir.textContent = 'confirmar?';
        return;
      }
      alvoExcluir.disabled = true;
      api('/api/comment.delete', { corpo: { key: d.key, id: idX } }).then(function () {
        toast('Comentário excluído.');
        return recarregarDetalhe();
      }).catch(function (e) {
        toast('Erro ao excluir comentário: ' + comoMensagem(e), true);
        alvoExcluir.disabled = false; alvoExcluir.textContent = 'excluir';
        delete alvoExcluir.dataset.confirmando;
      });
    }
  }
  function pintarAnexos(d) {
    var listaA = lista(d.anexos);
    var html = '<div class="bloco"><h3>Enviar arquivo</h3>' +
      '<label class="solta" id="soltaArquivo">' +
        '<input type="file" id="arquivo" multiple>' +
        '<div>Clique para escolher um arquivo, ou arraste aqui.</div>' +
        '<div class="temporario" id="estadoArquivo"></div>' +
      '</label></div>' +
      '<div class="bloco"><h3>Anexos (' + listaA.length + ')</h3>';

    html += listaA.length ? listaA.map(function (a) {
      var ext = String(a.nome || '').split('.').pop().slice(0, 4).toUpperCase();
      var href = String(a.url || '').indexOf('/') === 0 ? a.url : '/' + String(a.url || '');
      return '<div class="anexo">' +
        '<span class="icone">' + esc(ext) + '</span>' +
        '<span class="nm"><a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer" title="' + esc(a.nome) + '">' +
          esc(a.nome) + '</a>' +
          '<span>' + esc(tamanho(a.tamanho)) + ' &middot; ' + esc(nomeDe(a.autor) || a.autor || 'desconhecido') +
          ' &middot; ' + esc(dataHora(a.criado)) + '</span></span>' +
        '<a class="mini" href="' + esc(href) + '" download>baixar</a>' +
      '</div>';
    }).join('') : '<div class="caixa vazia">Nenhum anexo.</div>';

    html += '</div>';
    $('pCorpo').innerHTML = html;
    $('pPe').innerHTML = '';

    var entrada = $('arquivo');
    entrada.onchange = function () {
      var arquivos = Array.prototype.slice.call(entrada.files || []);
      if (arquivos.length) enviarAnexos(arquivos);
      entrada.value = '';
    };
    var zona = $('soltaArquivo');
    ['dragover', 'dragenter'].forEach(function (ev) {
      zona.addEventListener(ev, function (e) { e.preventDefault(); zona.classList.add('por-cima'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      zona.addEventListener(ev, function () { zona.classList.remove('por-cima'); });
    });
    zona.addEventListener('drop', function (e) {
      e.preventDefault();
      var arquivos = Array.prototype.slice.call((e.dataTransfer && e.dataTransfer.files) || []);
      if (arquivos.length) enviarAnexos(arquivos);
    });
  }

  function lerBase64(arquivo) {
    return new Promise(function (resolve, reject) {
      var leitor = new FileReader();
      leitor.onload = function () {
        var r = String(leitor.result || '');
        resolve(r.indexOf(',') >= 0 ? r.slice(r.indexOf(',') + 1) : r);
      };
      leitor.onerror = function () { reject(new Error('não foi possível ler ' + arquivo.name)); };
      leitor.readAsDataURL(arquivo);
    });
  }

  function enviarAnexos(arquivos) {
    var d = S.detalhe;
    if (!d) return;
    var estado = $('estadoArquivo');
    var feitos = 0, falhas = 0;
    var fila = arquivos.reduce(function (p, a) {
      return p.then(function () {
        if (estado) estado.textContent = 'enviando ' + a.name + '…';
        return lerBase64(a).then(function (b64) {
          return api('/api/attachment', { corpo: { key: d.key, nome: a.name, mime: a.type || 'application/octet-stream', base64: b64 } });
        }).then(function () {
          feitos++;
        }).catch(function (e) {
          falhas++;
          toast('Falha ao anexar ' + a.name + ': ' + comoMensagem(e), true);
        });
      });
    }, Promise.resolve());

    fila.then(function () {
      if (estado) estado.textContent = '';
      if (feitos) toast(feitos === 1 ? 'Anexo enviado.' : feitos + ' anexos enviados.');
      if (feitos || falhas) recarregarDetalhe();
    });
  }

  /* ----------------------------- aba Histórico --------------------------- */
  function pintarHistorico(d) {
    var hist = lista(d.historico);
    var html = '<div class="bloco"><h3>Histórico (' + hist.length + ')</h3>';
    html += hist.length ? hist.map(function (h) {
      var itens = lista(h.itens).map(function (it) {
        var de = it.de === '' || it.de == null ? '(vazio)' : it.de;
        var para = it.para === '' || it.para == null ? '(vazio)' : it.para;
        return '<div style="padding-left:2px;margin-top:3px">' +
          '<span class="campo-nome">' + esc(it.campo) + ':</span> ' +
          '<span class="de">' + esc(de) + '</span> <span class="seta-m">\u2192</span> ' +
          '<span class="para">' + esc(para) + '</span></div>';
      }).join('');
      return '<div class="mudanca" style="display:block">' +
        '<span class="quem">' + esc(h.autor || 'alguém') + '</span> ' +
        '<span class="quando">' + esc(dataHora(h.quando)) + '</span>' + itens + '</div>';
    }).join('') : '<div class="caixa vazia">Sem histórico visível.</div>';
    html += '</div>';
    $('pCorpo').innerHTML = html;
    $('pPe').innerHTML = '';
  }

  function recarregarDetalhe() {
    var d = S.detalhe;
    if (!d) return Promise.resolve();
    return api('/api/issue?key=' + encodeURIComponent(d.key)).then(function (novo) {
      S.detalhe = novo;
      pintarCabecalho(novo);
      renderAba();
    }).catch(function (e) {
      toast('Erro ao reler ' + d.key + ': ' + comoMensagem(e), true);
    });
  }

  /* ======================================================================
     Modal de nova tarefa
     ====================================================================== */
  function abrirNova(paiKey) {
    var m = S.meta || {};
    $('mProj').textContent = txt(m.projeto, 'CON');
    $('cResumo').value = '';
    $('cDesc').value = '';
    $('cLabels').value = '';
    $('cVenc').value = '';
    $('cPai').value = txt(paiKey);

    $('cTipo').innerHTML = lista(m.tipos).filter(function (t) { return !t.subtarefa; })
      .map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.nome) + '</option>'; }).join('')
      || '<option value="">(padrão do projeto)</option>';
    $('cPri').innerHTML = '<option value="">(padrão)</option>' + lista(m.prioridades).map(function (p) {
      return '<option value="' + esc(p) + '"' + (p === 'Medium' ? ' selected' : '') + '>' + esc(p) + '</option>';
    }).join('');
    $('cResp').innerHTML = '<option value="">— sem responsável —</option>' + lista(m.usuarios).map(function (u) {
      return '<option value="' + esc(u.id) + '"' + (S.eu && u.id === S.eu.id ? ' selected' : '') + '>' + esc(u.nome) + '</option>';
    }).join('');

    $('modal').classList.add('on');
    $('fundo').classList.add('on');
    setTimeout(function () { $('cResumo').focus(); }, 40);
  }
  function fecharNova() {
    $('modal').classList.remove('on');
    if (!$('painel').classList.contains('on')) $('fundo').classList.remove('on');
  }

  function criarNova() {
    var resumo = $('cResumo').value.trim();
    if (!resumo) { toast('O resumo é obrigatório.', true); $('cResumo').focus(); return; }
    var pai = $('cPai').value.trim();
    var dados = {
      summary: resumo,
      tipoId: $('cTipo').value,
      descricao: $('cDesc').value,
      priority: $('cPri').value,
      assigneeAccountId: $('cResp').value,
      duedate: $('cVenc').value,
      labels: virarArray($('cLabels').value)
    };
    if (pai) dados.parentKey = pai;

    var b = $('cCriar');
    b.disabled = true; b.textContent = 'Criando…';
    api('/api/create', { corpo: dados }).then(function (r) {
      toast('Tarefa ' + r.key + ' criada.');
      fecharNova();
      recarregar(true);
    }).catch(function (e) {
      toast('Erro ao criar: ' + comoMensagem(e), true);
    }).then(function () {
      b.disabled = false; b.textContent = 'Criar tarefa';
    });
  }

  /* ======================================================================
     Carregar do servidor
     ====================================================================== */
  var carregandoAgora = false;
  function recarregar(silencioso) {
    if (carregandoAgora) return Promise.resolve();
    carregandoAgora = true;
    if (!silencioso) carregando();
    var b = $('btnAtualizar');
    b.disabled = true; b.textContent = 'Atualizando…';

    return api('/api/bootstrap').then(function (d) {
      var antigo = S.issues;
      S.meta = d.meta || {};
      S.eu = S.meta.eu || null;
      S.issues = lista(d.issues);
      $('tagProj').textContent = txt(S.meta.projeto, 'Jira') + (S.meta.site ? ' · ' + String(S.meta.site).replace(/^https?:\/\//, '').replace(/\/.*$/, '') : '');
      document.title = 'Kanban ' + txt(S.meta.projeto, '');
      /* Ligacao com o app de conformidade: so mostra quando o servidor informa
         a URL (KANBAN_APP_URL). Sem isso o botao nao aparece, em vez de virar
         um link quebrado. */
      (function () {
        var a = $('linkApp');
        if (!a) return;
        if (S.meta && S.meta.app) {
          a.href = S.meta.app;
          a.classList.remove('oculto');
        } else {
          a.classList.add('oculto');
          a.removeAttribute('href');
        }
      })();
      preencherFiltros();
      render();
      /* o painel aberto é repintado com os dados novos quando possível */
      if (S.detalhe) {
        var k = S.detalhe.key;
        var resumo = antigo.filter(function (x) { return x.key === k; })[0];
        if (!resumo) fecharDetalhe(); else recarregarDetalhe();
      }
    }).catch(function (e) {
      vista.innerHTML = '<div class="aviso-vazio">Não foi possível ler o Jira.<br>' + esc(comoMensagem(e)) + '</div>';
      $('contador').textContent = 'erro';
      toast('Erro ao carregar: ' + comoMensagem(e), true);
    }).then(function () {
      carregandoAgora = false;
      b.disabled = false; b.textContent = 'Atualizar';
    });
  }

  function preencherFiltros() {
    var m = S.meta || {};
    var tipos = lista(m.tipos).map(function (t) { return t.nome; });
    var labels = lista(m.labels).length ? lista(m.labels) : unicos(S.issues, 'labels');
    var usuarios = lista(m.usuarios);

    function opcoes(itens, rotulo, atual) {
      var h = '<option value="">' + esc(rotulo) + '</option>';
      itens.forEach(function (o) {
        h += '<option value="' + esc(o.v) + '"' + (o.v === atual ? ' selected' : '') + '>' + esc(o.t) + '</option>';
      });
      return h;
    }
    $('fTipo').innerHTML = opcoes(tipos.map(function (t) { return { v: t, t: t }; }), 'todos os tipos', S.filtros.tipo);
    $('fResp').innerHTML = opcoes(
      [{ v: '__ninguem__', t: 'sem responsável' }].concat(usuarios.map(function (u) { return { v: u.id, t: u.nome }; })),
      'todos os responsáveis', S.filtros.responsavel);
    $('fPri').innerHTML = opcoes(lista(m.prioridades).map(function (p) { return { v: p, t: p }; }), 'todas as prioridades', S.filtros.prioridade);
    $('fLabel').innerHTML = opcoes(labels.map(function (l) { return { v: l, t: l }; }), 'todas as etiquetas', S.filtros.label);
  }

  /* ======================================================================
     Eventos
     ====================================================================== */
  var temporizadorBusca = null;
  $('busca').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(temporizadorBusca);
    temporizadorBusca = setTimeout(function () {
      S.filtros.busca = v;
      salvarPreferencias();
      render();
    }, 130);
  });

  $('fTipo').addEventListener('change', function (e) { S.filtros.tipo = e.target.value; salvarPreferencias(); render(); });
  $('fResp').addEventListener('change', function (e) { S.filtros.responsavel = e.target.value; salvarPreferencias(); render(); });
  $('fPri').addEventListener('change', function (e) { S.filtros.prioridade = e.target.value; salvarPreferencias(); render(); });
  $('fLabel').addEventListener('change', function (e) { S.filtros.label = e.target.value; salvarPreferencias(); render(); });

  function alternarAbertas() {
    S.filtros.abertas = !S.filtros.abertas;
    $('tAbertas').classList.toggle('on', S.filtros.abertas);
    $('tAbertas').setAttribute('aria-checked', S.filtros.abertas ? 'true' : 'false');
    salvarPreferencias();
    render();
  }
  $('tAbertas').addEventListener('click', alternarAbertas);
  $('tAbertas').addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); alternarAbertas(); }
  });

  $('btnLimpar').onclick = function () {
    S.filtros = { busca: '', tipo: '', responsavel: '', prioridade: '', label: '', abertas: false };
    S.concluidasAbertas = {};
    $('busca').value = '';
    $('tAbertas').classList.remove('on');
    $('tAbertas').setAttribute('aria-checked', 'false');
    preencherFiltros();
    salvarPreferencias();
    render();
  };

  function trocarVisao(v) {
    S.view = v;
    $('vKanban').classList.toggle('on', v === 'kanban');
    $('vLista').classList.toggle('on', v === 'lista');
    salvarPreferencias();
    render();
  }
  $('vKanban').onclick = function () { trocarVisao('kanban'); };
  $('vLista').onclick = function () { trocarVisao('lista'); };

  $('btnAtualizar').onclick = function () { recarregar(true).then(function () { toast('Quadro atualizado.'); }); };
  $('btnNova').onclick = function () { abrirNova(); };
  $('cCancelar').onclick = fecharNova;
  $('cCriar').onclick = criarNova;
  $('pFechar').onclick = fecharDetalhe;
  $('fundo').onclick = function () { fecharDetalhe(); fecharNova(); };

  $('pAbas').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('.aba') : null;
    if (!b) return;
    S.aba = b.dataset.aba;
    Array.prototype.forEach.call($('pAbas').querySelectorAll('.aba'), function (x) {
      x.classList.toggle('on', x.dataset.aba === S.aba);
    });
    renderAba();
  });

  /* cliques na área do quadro e no painel (delegação) */
  vista.addEventListener('click', function (ev) {
    var mais = ev.target.closest ? ev.target.closest('[data-mais]') : null;
    if (mais) { S.concluidasAbertas[mais.dataset.mais] = true; render(); return; }
    var menos = ev.target.closest ? ev.target.closest('[data-menos]') : null;
    if (menos) { delete S.concluidasAbertas[menos.dataset.menos]; render(); return; }

    var ordem = ev.target.closest ? ev.target.closest('th[data-ordem]') : null;
    if (ordem) {
      var c = ordem.dataset.ordem;
      if (S.ordens.coluna === c) S.ordens.dir = S.ordens.dir === 'asc' ? 'desc' : 'asc';
      else { S.ordens.coluna = c; S.ordens.dir = (c === 'atualizado' || c === 'vencimento' || c === 'prioridade') ? 'desc' : 'asc'; }
      render();
      return;
    }

    if (arrastando) return;
    var alvo = (ev.target.closest ? ev.target.closest('.cartao') : null) ||
               (ev.target.closest ? ev.target.closest('tr[data-key]') : null);
    if (alvo && alvo.dataset.key) abrirDetalhe(alvo.dataset.key);
  });

  vista.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    var c = ev.target.closest ? ev.target.closest('.cartao') : null;
    if (!c) return;
    ev.preventDefault();
    abrirDetalhe(c.dataset.key);
  });

  /* delegacao única do painel: abrir vínculos e ações de comentário */
  $('pCorpo').addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('[data-abrir]') : null;
    if (b) {
      ev.stopPropagation();
      abrirDetalhe(b.dataset.abrir, 'detalhes');
      return;
    }
    cliqueComentario(ev);
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if ($('modal').classList.contains('on')) { fecharNova(); return; }
      if ($('painel').classList.contains('on')) { fecharDetalhe(); return; }
    }
    var alvo = document.activeElement;
    var digitando = alvo && (alvo.tagName === 'INPUT' || alvo.tagName === 'TEXTAREA' || alvo.tagName === 'SELECT' || alvo.isContentEditable);
    if (ev.key === '/' && !digitando) { ev.preventDefault(); $('busca').focus(); }
  });

  /* Enter no resumo do modal cria a tarefa */
  $('cResumo').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); criarNova(); }
  });

  /* ======================================================================
     Início
     ====================================================================== */
  lerPreferencias();
  $('busca').value = S.filtros.busca || '';
  $('tAbertas').classList.toggle('on', !!S.filtros.abertas);
  $('tAbertas').setAttribute('aria-checked', S.filtros.abertas ? 'true' : 'false');
  trocarVisao(S.view);
  carregando();
  recarregar(false);
})();
</script>
</body>
</html>
